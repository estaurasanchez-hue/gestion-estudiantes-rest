<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Estudiantes - API RESTful</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Gestion de Estudiantes</h1>
            <p class="subtitle">Sistema basado en servicios RESTful - Unidad 4</p>
        </header>

        <section class="form-section">
            <h2 id="form-title">Registrar nuevo estudiante</h2>
            <form id="estudiante-form">
                <input type="hidden" id="estudiante-id">

                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" name="nombre" required maxlength="80" placeholder="Ej: Juan">
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido *</label>
                        <input type="text" id="apellido" name="apellido" required maxlength="80" placeholder="Ej: Perez">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Correo electronico *</label>
                        <input type="email" id="email" name="email" required maxlength="120" placeholder="Ej: juan.perez@universidad.edu">
                    </div>
                    <div class="form-group">
                        <label for="telefono">Telefono</label>
                        <input type="text" id="telefono" name="telefono" maxlength="20" placeholder="Ej: 3001234567">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="carrera">Carrera *</label>
                        <input type="text" id="carrera" name="carrera" required maxlength="100" placeholder="Ej: Ingenieria de Sistemas">
                    </div>
                    <div class="form-group">
                        <label for="semestre">Semestre *</label>
                        <input type="number" id="semestre" name="semestre" required min="1" max="20" placeholder="Ej: 5">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-guardar" class="btn btn-primary">Guardar</button>
                    <button type="button" id="btn-cancelar" class="btn btn-secondary hidden">Cancelar edicion</button>
                </div>
            </form>
        </section>

        <section class="table-section">
            <div class="table-header">
                <h2>Listado de estudiantes</h2>
                <button type="button" id="btn-refrescar" class="btn btn-outline">Actualizar listado</button>
            </div>

            <div id="mensaje" class="mensaje hidden"></div>

            <div class="table-wrapper">
                <table id="tabla-estudiantes">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>Email</th>
                            <th>Carrera</th>
                            <th>Semestre</th>
                            <th>Telefono</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-body">
                        <!-- Filas generadas dinamicamente -->
                    </tbody>
                </table>
            </div>
        </section>

        <footer>
            <p>API RESTful - Metodos GET, POST, PUT y DELETE | Arquitectura orientada a servicios</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
